backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"   # Složka pro nahrané obrázky
public_folder: "/images/uploads" # Cesta, pod kterou budou dostupné na webu

collections:
  - name: "obsah"
    label: "Obsah stránky"
    files:
      - file: "content.json"
        label: "Hlavní obsah"
        name: "content"
        fields:
          - { label: "Nadpis", name: "title", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - label: "Fotky"
            name: "photos"
            widget: "list"
            summary: "{{fields.photo}}"
            fields:
              - { label: "Fotka", name: "photo", widget: "image", required: false }
